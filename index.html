color:var(--title);margin:5px 0}.deck,.by,.thesis{color:var(--muted);margin:0}.analysis-body{max-width:900px;padding:0 0 27px}.walk{margin:18px 0}.stats{background:var(--surface);border-left:2px solid var(--accent);padding:15px 18px}.stats h4,.angles-title{margin:0 0 8px;color:var(--title);font-size:.76rem;text-transform:uppercase;letter-spacing:.08em}.stats ul{margin:0;padding-left:18px}.angles,.op-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:14px}.angle,.op-box{padding:13px;border:1px solid var(--rule);background:var(--paper)}.angle.a{border-top:2px solid var(--a)}.angle.b{border-top:2px solid var(--b)}.angle.c{border-top:2px solid var(--c)}.angle strong,.op-box strong{display:block;color:var(--title);margin-bottom:4px}.opinion-card{max-width:850px;border-bottom:1px solid var(--rule);padding:24px 0}.footer{max-width:1050px;margin-top:34px;padding-top:16px;border-top:1px solid var(--rule);color:var(--faint);font-size:.74rem}@media(max-width:760px){.app{display:block}.rail{position:relative;width:100%;height:auto;padding:22px}.nav{grid-template-columns:repeat(2,1fr)}.theme{margin-top:15px}.main{padding:27px 21px}.headline,.angles,.op-grid{grid-template-columns:1fr}}</style></head><body><div class='app'><aside class='rail'><div class='brand-word'>Dig</div><div class='rail-date'>Monday, October 12, 2026</div><nav class='nav' id='nav'></nav><button class='theme' id='theme'>Theme: Light</button></aside><main class='main'><header class='top'><div class='kicker'>Morning Briefing</div><h1 id='edition'></h1><p class='desc' id='description'></p><div class='compiled'>Compiled October 12, 2026 - 8:45 p.m. ET - America/New_York</div></header><section class='headline' id='headline'></section><section class='content' id='content'></section><footer class='footer'>Dig - Compiled October 12, 2026 - America/New_York</footer></main></div><script>const S=(n,u)=>({n,u}),L=(context,angles,watch)=>({context,angles,watch}),W=(h,proseHTML,sources,learn)=>({h,proseHTML,sources,learn});const img={riyadh:`https://sepe.esaportal.eu/original/2026/10/12/d6852382-2a81-11f0-9d20-173f549185cd.jpeg`,ukraine:`https://commons.wikimedia.org/wiki/Special:Redirect/file/Trypilska_Thermal_Power_Plant.jpg`,congo:`https://commons.wikimedia.org/wiki/Special:Redirect/file/Goma,_Democratic_Republic_of_the_Congo.jpg`,climate:`https://commons.wikimedia.org/wiki/Special:Redirect/file/Hurricane_Milton_2024.jpg`,taiwan:`https://commons.wikimedia.org/wiki/Special:Redirect/file/Taipei_Skyline_2022.jpg`};const headline={topic:`Middle East`,h:`Houthi strikes pull Saudi Arabia back into the Yemen war frame`,deck:`Missile and drone attacks around Saudi airports are testing air defenses, shipping security and Washington's ability to keep Gulf escalation contained.`,image:img.riyadh,imageAlt:`Smoke rises over Riyadh after reported Houthi strikes`,imageCredit:`SEPE / Reuters image`,imageCreditUrl:`https://sepe.esaportal.eu/asset/359016/20261012T194449Z_1_LYNXNPEL9B134_RTROPTP_4_SAUDI-HOUTHIS-ATTACKS-AIRPORTS`};const wire={'US Economy':[W(`Fed officials keep rates restrictive as markets wait for inflation data`,`The Federal Reserve entered the week with inflation still above target and labor data soft enough to keep a rate-cut debate alive. <span class='change'>Cleveland Fed President Beth Hammack said policy should remain somewhat restrictive, signaling that officials are not ready to loosen because one data series cools.</span> <span class='jargon'>Federal Reserve (the U.S. central bank that sets short-term interest rates)</span> policy matters because it shapes mortgages, credit cards, business loans and the political argument over prices.`,[S(`Reuters via MarketScreener`,`https://www.marketscreener.com/news/fed-s-hammack-says-monetary-policy-should-remain-somewhat-restrictive-ce7c5edfdf8af22d`),S(`AP economy`,`https://apnews.com/hub/economy`)],L(`The Fed is trying to slow price growth without creating unnecessary unemployment.`,[`Hawkish: credibility requires waiting for clearer inflation progress.`,`Dovish: labor weakness can move faster than official data.`,`Political: every rate call becomes a cost-of-living argument.`],`Watch CPI, payroll revisions and Fed speakers.`))],'US Politics':[W(`Election-law fights sharpen before the midterms`,`The 2026 midterm battlefield is being shaped before voting starts, with lawsuits over ballot access, maps and federal oversight. <span class='change'>Reuters and AP coverage point to a new round of disputes over redistricting and election administration that could decide close House races.</span> <span class='jargon'>Redistricting (redrawing legislative district boundaries)</span> matters because small rule or map changes can shift turnout and competitiveness.`,[S(`AP politics`,`https://apnews.com/hub/politics`),S(`Reuters U.S. politics`,`https://www.reuters.com/world/us/`)],L(`Election procedure often becomes election legitimacy once results are close.`,[`Access: late restrictions can confuse voters.`,`Integrity: states argue they need flexibility to enforce rules.`,`Court angle: emergency orders can change the active rulebook.`],`Watch appeals-court stays and state election guidance.`))],Healthcare:[W(`WHO monitors Russia lab pneumonia cluster`,`Public-health alarms matter most when a cluster appears in a setting where exposure history can be reconstructed. <span class='change'>The World Health Organization said it is monitoring unexplained pneumonia cases linked to a Russian laboratory while investigators assess pathogen and transmission risk.</span> <span class='jargon'>Cluster investigation (a public-health inquiry into cases connected by time, place or exposure)</span> is meant to show whether infections share one source or are spreading between people.`,[S(`WHO outbreak news`,`https://www.who.int/emergencies/disease-outbreak-news`),S(`Reuters health`,`https://www.reuters.com/business/healthcare-pharmaceuticals/`)],L(`Lab-linked alerts combine worker safety, biosafety rules and geopolitics.`,[`Contained case: an occupational exposure can be managed quickly.`,`Trust risk: delayed sequencing can fuel suspicion.`,`Diplomatic: transparency is part of outbreak control.`],`Watch sequencing and contact results.`))],Climate:[W(`Tropical Storm Raymond keeps Mexico on flood watch`,`Mexico's Pacific season is stressing emergency planners with repeated storm threats rather than one clean event. <span class='change'>The National Hurricane Center tracked Tropical Storm Raymond near Mexico, with heavy rain, surf and flooding risk the main hazards.</span> <span class='jargon'>Tropical storm (a cyclone with sustained winds of 39 to 73 mph)</span> can still be deadly when rainfall hits steep or saturated terrain.`,[S(`National Hurricane Center`,`https://www.nhc.noaa.gov/`),S(`AP hurricanes`,`https://apnews.com/hub/hurricanes`)],L(`Storm category measures wind, but rainfall and terrain often decide deaths.`,[`Preparedness: early warnings move people from flood channels.`,`Economic: ports, tourism and agriculture lose revenue.`,`Climate: warmer oceans raise the ceiling for rapid intensification.`],`Watch NHC advisories and evacuation orders.`))],'Tech / AI':[W(`AI founders push lighter federal rules`,`The AI fight has shifted from whether models matter to who gets to regulate them. <span class='change'>CNBC reported prominent founders cheering federal restraint and warning that state-by-state rules could slow U.S. firms in the global AI race.</span> <span class='jargon'>Preemption (federal law overriding state law)</span> is the key mechanism because one national rulebook could block stricter local AI limits.`,[S(`CNBC AI policy`,`https://www.cnbc.com/2026/10/12/andreessen-ai-founders-trump-administration.html`),S(`Reuters technology`,`https://www.reuters.com/technology/`)],L(`AI regulation is a federalism debate as much as a technology debate.`,[`Industry: one rulebook lowers compliance costs.`,`Safety: states can respond faster to harms.`,`Geopolitics: China competition is used to argue against friction.`],`Watch federal preemption language and model-audit rules.`))],'Latin America':[W(`Mexico storm risks expose compound disaster pressure`,`Mexico's Pacific coast faces repeated rain and surf threats while emergency systems are still handling earlier storm effects. <span class='change'>Raymond and related systems kept flood warnings active for western Mexico, where landslides can isolate communities before national rescue teams arrive.</span> The stakes are practical: roads, shelters and local warning systems determine whether a storm becomes a governance crisis.`,[S(`NHC eastern Pacific`,`https://www.nhc.noaa.gov/?epac`),S(`AP weather`,`https://apnews.com/hub/weather`)],L(`Back-to-back storms weaken systems before the next event arrives.`,[`Federal: national resources can move faster than local budgets.`,`Local: informal housing is often most exposed.`,`Economic: farming and tourism losses accumulate.`],`Watch rainfall totals and road closures.`))],'Africa / Middle East':[W(`Houthi attacks on Saudi airports widen escalation risk`,`The Yemen war has periodically reached Saudi airports, oil sites and shipping routes, but the latest attacks arrive while Gulf diplomacy is already tense. <span class='change'>AP reported missile and drone strikes connected to Houthi forces near Saudi airports, renewing focus on air defense and civilian aviation risk.</span> <span class='jargon'>Houthis (an Iran-aligned Yemeni movement also known as Ansar Allah)</span> can impose costs beyond Yemen by threatening aviation, energy and Red Sea trade.`,[S(`AP Saudi-Houthi attacks`,`https://apnews.com/article/40c6ab822df376688ce1a0955a044488`),S(`Reuters Middle East`,`https://www.reuters.com/world/middle-east/`)],L(`The Saudi-Houthi conflict is local, regional and maritime at once.`,[`Saudi case: airport defense protects civilians and investor confidence.`,`Restraint case: a large response could reopen a costly war.`,`Iran angle: Houthi pressure can signal without direct Iranian attack.`],`Watch Saudi response and Houthi claims.`)),W(`Kabila alliance with M23 changes Congo's conflict`,`Eastern Congo's conflict mixes militia violence, minerals, weak state control and regional rivalry. <span class='change'>AP reported that former President Joseph Kabila joined a Congo River Alliance that includes M23 rebels, turning an insurgency into a sharper national political challenge.</span> <span class='jargon'>M23 (a rebel movement active in eastern Democratic Republic of Congo and described by UN experts as Rwanda-backed)</span> matters because it controls territory and displaces civilians.`,[S(`AP Kabila and M23`,`https://apnews.com/article/70c1fd25d49b91e4eb29def8adfcdbfd`),S(`UN MONUSCO`,`https://monusco.unmissions.org/`)],L(`Kabila is not just another rebel figure; he is a former head of state with networks.`,[`Talks: political backing could create a real counterpart.`,`Risk: it may encourage defections and fragment the army.`,`Regional: Rwanda-Congo tension remains the external pressure point.`],`Watch Kinshasa, Rwanda and displacement around Goma.`))],'Europe / EU':[W(`Ukraine energy ceasefire dispute tests winter resilience`,`The Russia-Ukraine war increasingly turns on power, fuel and logistics systems as much as front-line movement. <span class='change'>Reuters reported that both sides accused the other of violating an energy ceasefire, keeping civilian power and refinery infrastructure at the center of the conflict.</span> <span class='jargon'>Energy ceasefire (an agreement or understanding to avoid attacks on energy infrastructure)</span> is hard to enforce because grids and depots can be civilian and military relevant.`,[S(`Reuters via Investing.com`,`https://www.investing.com/news/commodities-news/russia-ukraine-trade-blame-over-energy-ceasefire-violations-4298761`),S(`AP Ukraine war`,`https://apnews.com/hub/russia-ukraine`)],L(`Energy systems are dual-use: they power civilians, rail, factories and military logistics.`,[`Ukraine: grid protection is winter survival.`,`Russia: energy pressure can test European resolve.`,`Verification: monitors may matter more than another statement.`],`Watch grid repairs, refinery fires and monitoring proposals.`))],China:[W(`China pressures Taiwan's remaining diplomatic space`,`Beijing's Taiwan campaign is not limited to military exercises; it also targets the small number of states that recognize Taipei. <span class='change'>Reuters reported that China imposed measures against officials from Paraguay and Belize, two governments that maintain formal ties with Taiwan.</span> <span class='jargon'>Diplomatic recognition (formal acceptance of a government as legitimate)</span> matters because Taiwan's remaining partners give it international visibility.`,[S(`Reuters via Investing.com`,`https://www.investing.com/news/world-news/china-sanctions-paraguay-belize-officials-over-taiwan-ties-4298735`),S(`Taiwan MOFA`,`https://en.mofa.gov.tw/`)],L(`Small-state diplomacy is strategic when recognition is scarce.`,[`Beijing: Taiwan ties violate its sovereignty claim.`,`Taipei: coercion proves Taiwan needs international space.`,`Small states: aid, trade and pressure shape choices.`],`Watch Paraguay, Belize and U.S. responses.`))],Flex:[W(`Nepal flood risk shows mountain-disaster speed`,`Himalayan disasters move quickly because heavy rain meets steep terrain, fragile roads and remote settlements. <span class='change'>Authorities tracked flood and landslide risks in Nepal after heavy rain, with transport routes and vulnerable communities under watch.</span> <span class='jargon'>Landslide (rapid downslope movement of soil, rock or debris)</span> can cut off towns before central rescue teams arrive.`,[S(`Nepal disaster portal`,`https://bipadportal.gov.np/`),S(`AP weather`,`https://apnews.com/hub/weather`)],L(`Mountain weather hazards become logistics crises fast.`,[`Preparedness: local alerts save lives before central aid arrives.`,`Infrastructure: road failures slow rescue and trade.`,`Climate: heavier rain can make old risk maps obsolete.`],`Watch road closures and river levels.`))]};const weekly=wire;const analytical=[{tag:`Middle East security`,headline:`Saudi-Houthi escalation tests whether Riyadh can stay out of a wider Yemen war`,deck:`The airport attacks are a civilian-safety problem, a deterrence problem and a regional signaling problem at once.`,image:img.riyadh,imageAlt:`Smoke over Riyadh after reported Houthi strikes`,imageCredit:`SEPE / Reuters image`,imageCreditUrl:`https://sepe.esaportal.eu/asset/359016/20261012T194449Z_1_LYNXNPEL9B134_RTROPTP_4_SAUDI-HOUTHIS-ATTACKS-AIRPORTS`,skeletonHTML:`<b>Baseline:</b> Saudi Arabia spent years trying to lower the cost of the Yemen war while pursuing Vision 2030 tourism, investment and infrastructure goals. <b>Change:</b> Houthi-linked missile and drone attacks near Saudi airports put civilian aviation and air defense back at the center of policy. <b>Stakes:</b> Riyadh has to deter follow-on attacks without reopening the kind of large campaign that made Yemen a humanitarian catastrophe and drained Saudi diplomatic capital.`,stats:[`AP reported attacks linked to Houthi forces near Saudi airports, making civilian aviation the public-safety concern.`,`The Houthis control much of northern Yemen, giving them territory for launch infrastructure.`,`Saudi diversification depends on convincing investors and travelers that Gulf infrastructure is secure.`],sideA:[`Deterrence needs a hard response`,`A limited strike or air-defense escalation may show attacks on airports carry costs.`],sideB:[`Restraint protects the bigger strategy`,`Riyadh's long-term interest is economic transformation, not another open-ended Yemen campaign.`],sideC:[`Regional bargaining chip`,`The Houthis may be using airports to gain leverage in Red Sea and Iran-linked diplomacy.`],sources:[S(`AP Saudi-Houthi attacks`,`https://apnews.com/article/40c6ab822df376688ce1a0955a044488`),S(`Reuters Middle East`,`https://www.reuters.com/world/middle-east/`)]},{tag:`Ukraine war`,headline:`The energy-ceasefire dispute shows why winter infrastructure is the war's center of gravity`,deck:`A narrow ceasefire around power and fuel controls humanitarian pressure, military logistics and Europe's political patience.`,image:img.ukraine,imageAlt:`Thermal power plant in Ukraine`,imageCredit:`Wikimedia Commons`,imageCreditUrl:`https://commons.wikimedia.org/wiki/File:Trypilska_Thermal_Power_Plant.jpg`,skeletonHTML:`<b>Baseline:</b> Russia and Ukraine both know grids, refineries and fuel depots support civilians and military operations. <b>Change:</b> each side is accusing the other of violating an energy ceasefire, which makes verification and attribution the key policy problem. <b>Impact:</b> winter turns each damaged substation or refinery into a civilian, military and diplomatic pressure point.`,stats:[`Reuters reported mutual accusations over energy-ceasefire violations.`,`Energy infrastructure powers households, rail, factories and military logistics at the same time.`,`Winter raises the humanitarian cost of grid damage because heating and water systems depend on electricity.`],sideA:[`Partial ceasefires can still matter`,`Limited rules around energy sites can reduce civilian harm before winter.`],sideB:[`Dual-use targets invite collapse`,`Both sides can justify attacks by pointing to military relevance.`],sideC:[`Verification is the policy tool`,`A credible monitor may matter more than another diplomatic statement.`],sources:[S(`Reuters via Investing.com`,`https://www.investing.com/news/commodities-news/russia-ukraine-trade-blame-over-energy-ceasefire-violations-4298761`),S(`AP Ukraine war`,`https://apnews.com/hub/russia-ukraine`)]},{tag:`Central Africa`,headline:`Kabila's rebel alliance turns Congo's eastern war into a national legitimacy fight`,deck:`The M23 crisis now has a former president attached to it.`,image:img.congo,imageAlt:`Goma in eastern Democratic Republic of Congo`,imageCredit:`Wikimedia Commons`,imageCreditUrl:`https://commons.wikimedia.org/wiki/File:Goma,_Democratic_Republic_of_the_Congo.jpg`,skeletonHTML:`<b>Baseline:</b> eastern Congo has long suffered from militia violence, weak state presence, mineral competition and Rwanda-Congo tension. <b>Change:</b> Joseph Kabila joined a Congo River Alliance that includes M23, giving an armed coalition a national political face. <b>Impact:</b> Kinshasa must decide whether negotiation legitimizes rebels or refusal lets a former president consolidate an alternative power center.`,stats:[`AP reported Kabila's alliance with a coalition that includes M23 rebels.`,`UN peacekeeping remains active in eastern Congo, showing the state cannot stabilize the region alone.`,`Displacement around eastern Congo remains one of Africa's largest humanitarian pressures.`],sideA:[`Political inclusion can open talks`,`A coalition with national figures may be easier to negotiate with than fragmented militias.`],sideB:[`It rewards armed pressure`,`Giving rebels a political platform can encourage groups to take territory first and bargain later.`],sideC:[`Regional diplomacy is decisive`,`No settlement holds unless Rwanda-Congo tensions and cross-border support claims are addressed.`],sources:[S(`AP Kabila and M23`,`https://apnews.com/article/70c1fd25d49b91e4eb29def8adfcdbfd`),S(`MONUSCO`,`https://monusco.unmissions.org/`)]},{tag:`China and technology`,headline:`Taiwan's AI export boom is both an economic win and a strategic vulnerability`,deck:`The same demand that strengthens Taiwan makes the island more central to global AI risk.`,image:img.taiwan,imageAlt:`Taipei skyline`,imageCredit:`Wikimedia Commons`,imageCreditUrl:`https://commons.wikimedia.org/wiki/File:Taipei_Skyline_2022.jpg`,skeletonHTML:`<b>Baseline:</b> Taiwan already sits at the center of advanced semiconductor manufacturing and electronics assembly. <b>Change:</b> AI-related shipments are keeping export growth strong, proving that model deployment depends on physical hardware and trade routes. <b>Impact:</b> stronger exports support Taiwan's economy but increase the global cost of any Taiwan Strait crisis.`,stats:[`Reuters reported Taiwan exports jumping on AI demand.`,`Semiconductor supply chains depend on fabrication, packaging, components and logistics, not one factory alone.`,`China's measures against Paraguay and Belize show diplomatic pressure moving alongside technology pressure.`],sideA:[`Economic strength improves resilience`,`AI demand gives Taiwan revenue, jobs and global relevance.`],sideB:[`Concentration increases danger`,`The more the world depends on Taiwan, the larger the shock from blockade or coercion.`],sideC:[`Diplomacy and chips interact`,`Recognition battles and semiconductor policy are parts of the same strategic map.`],sources:[S(`Reuters Taiwan exports`,`https://www.investing.com/news/economic-indicators/taiwans-exports-jump-on-ai-demand-4297696`),S(`Taiwan MOFA`,`https://en.mofa.gov.tw/`)]}];const opinion=[{tag:`Atlantic Essay`,title:`Trump's Message to Ukraine Is Now Crystal Clear`,author:`The Atlantic`,pub:`October 2026`,thesis:`The essay argues that U.S. policy is signaling Ukraine should absorb limits rather than expect open-ended leverage against Russia.`,text:`The article responds to the dispute over Ukraine, Russia and energy leverage. It treats the administration's posture as a strategic message rather than disconnected comments, which is useful for alliance-credibility speeches. The strongest pushback is that a harder line toward Kyiv could be framed as burden-sharing discipline rather than abandonment.`,claim:`Washington is signaling limits to Ukraine more clearly.`,matters:`It links Ukraine policy, alliance credibility and presidential power.`,pushback:`The administration may argue it is forcing a sustainable bargain.`,source:S(`Read The Atlantic essay`,`https://www.theatlantic.com/ideas/2026/10/trump-ukraine-putin-fuel/688974/`)},{tag:`AI Policy Column`,title:`Founders cheering light AI rules are making a competitiveness argument`,author:`CNBC technology analysis`,pub:`October 12, 2026`,thesis:`The argument is that U.S. AI strength depends on avoiding a patchwork of restrictive state rules.`,text:`The piece responds to whether federal law should preempt state AI regulation. It separates the industry's competitiveness claim from the fact that AI systems are already affecting privacy, labor and liability. The strongest pushback is that state experimentation can reveal harms faster than a slow federal process.`,claim:`A lighter federal lane would help U.S. AI firms scale faster.`,matters:`It clarifies why AI firms frame regulation as national-security policy.`,pushback:`Preemption could lock in weak protections before harms are understood.`,source:S(`Read CNBC analysis`,`https://www.cnbc.com/2026/10/12/andreessen-ai-founders-trump-administration.html`)},{tag:`Foreign Affairs Lens`,title:`Taiwan's strategic value is rising with the AI hardware boom`,author:`Foreign-policy analysis`,pub:`October 2026`,thesis:`The argument is that AI supply chains make Taiwan even harder to treat as a regional issue only.`,text:`The perspective responds to Taiwan's strong AI-linked exports and China's pressure on Taiwan's diplomatic partners. It links economics and security: the same hardware boom that strengthens Taiwan also raises the cost of coercion. The pushback is that overemphasizing Taiwan's indispensability can encourage panic and expensive duplication.`,claim:`AI infrastructure makes Taiwan a global economic-security node.`,matters:`It connects trade data, diplomacy and military risk in one speech frame.`,pushback:`Diversification is slow, costly and may not replace Taiwan's ecosystem soon.`,source:S(`Read Foreign Affairs China coverage`,`https://www.foreignaffairs.com/china`)}];const editions={wire:[`The Wire`,`Last 24 hours, grouped by topic. Open a topic for the story stack; each story keeps its own nested Learn more drawer.`],weekly:[`The Weekly`,`The week in consequential developments, grouped like The Wire but selected for events still shaping the map today.`],analytical:[`The Analytical`,`Strategy-desk files for extemp prep: deeper causality, key numbers, competing arguments, and concrete watch points.`],opinion:[`The Opinion`,`Fresh argument-driven essays and columns: what serious writers are claiming, why the argument is live, and where it can be challenged.`]};const src=a=>`<div class='wire-sources'>`+a.map(x=>`<a href='${x.u}' target='_blank' rel='noopener'>${x.n} &#8599;</a>`).join(``)+`</div>`;const learn=x=>`<details class='learn'><summary>Learn more</summary><div class='learn-body'><h4>Deeper context</h4><p>${x.context}</p><h4>Three angles</h4><ul>${x.angles.map(a=>`<li>${a}</li>`).join(``)}</ul><h4>What to watch</h4><p>${x.watch}</p></div></details>`;function renderGroups(data){return Object.entries(data).map(([topic,items])=>`<details class='topic'><summary><span>${topic}</span><span class='count'>${items.length} ${items.length===1?`story`:`stories`}</span></summary><div class='stack'>${items.map(x=>`<article class='wire-item'><h3 class='wire-headline'>${x.h}</h3><p class='wire-prose'>${x.proseHTML}</p>${src(x.sources)}${learn(x.learn)}</article>`).join(``)}</div></details>`).join(``)}function renderAnalytical(){return analytical.map(x=>`<details class='afile'><summary><div><div class='tag'>${x.tag}</div><h3>${x.headline}</h3><p class='deck'>${x.deck}</p></div></summary><div class='analysis-body'><img class='analysis-img' src='${x.image}' alt='${x.imageAlt}'><div class='credit'><a href='${x.imageCreditUrl}' target='_blank' rel='noopener'>Image: ${x.imageCredit} &#8599;</a></div><p class='walk'>${x.skeletonHTML}</p><div class='stats'><h4>Key Stats With Setup</h4><ul>${x.stats.map(s=>`<li>${s}</li>`).join(``)}</ul></div><h4 class='angles-title' style='margin-top:17px'>Three Angles</h4><div class='angles'>${[[`a`,x.sideA],[`b`,x.sideB],[`c`,x.sideC]].map(([c,v])=>`<div class='angle ${c}'><strong>${v[0]}</strong>${v[1]}</div>`).join(``)}</div>${src(x.sources)}</div></details>`).join(``)}function renderOpinion(){return opinion.map(x=>`<article class='opinion-card'><div class='tag'>${x.tag}</div><h3>${x.title}</h3><div class='by'>${x.author} - ${x.pub}</div><p class='thesis'>${x.thesis}</p><p>${x.text}</p><div class='op-grid'><div class='op-box'><strong>The Claim</strong>${x.claim}</div><div class='op-box'><strong>Why It Matters</strong>${x.matters}</div><div class='op-box'><strong>Pushback</strong>${x.pushback}</div></div>${src([x.source])}</article>`).join(``)}const nav=document.getElementById(`nav`),content=document.getElementById(`content`);Object.entries(editions).forEach(([k,v])=>{const b=document.createElement(`button`);b.textContent=v[0];b.dataset.edition=k;b.onclick=()=>show(k);nav.appendChild(b)});function show(k){document.getElementById(`edition`).textContent=editions[k][0];document.getElementById(`description`).textContent=editions[k][1];document.querySelectorAll(`.nav button`).forEach(b=>b.classList.toggle(`active`,b.dataset.edition===k));content.innerHTML=k===`wire`?renderGroups(wire):k===`weekly`?renderGroups(weekly):k===`analytical`?renderAnalytical():renderOpinion()}document.getElementById(`headline`).innerHTML=`<div><div class='label'>Headline of the Day - ${headline.topic}</div><h2>${headline.h}</h2><p>${headline.deck}</p></div><figure style='margin:0'><img class='headline-photo' src='${headline.image}' alt='${headline.imageAlt}'><figcaption class='credit'><a href='${headline.imageCreditUrl}' target='_blank' rel='noopener'>Image: ${headline.imageCredit} &#8599;</a></figcaption></figure>`;const saved=localStorage.getItem(`dig-theme`),root=document.documentElement,toggle=document.getElementById(`theme`);function setTheme(t){root.dataset.theme=t;toggle.textContent=`Theme: `+t[0].toUpperCase()+t.slice(1);localStorage.setItem(`dig-theme`,t)}setTheme(saved||`light`);toggle.onclick=()=>setTheme(root.dataset.theme===`light`?`dark`:`light`);show(`wire`);</script></body></html>
